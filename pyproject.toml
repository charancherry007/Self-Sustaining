[project]
name = "trading-system"
version = "0.1.0"
description = "Read-only market analysis and web research MCP servers for an AI trading orchestrator."
requires-python = ">=3.12"
dependencies = [
    # --- shared ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=2.0",
    # --- market_analyzer ---
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "streamlit>=1.35",
    # --- web_search_mcp ---
    "duckduckgo-search>=6.0",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# CLI entry points
[project.scripts]
market-analyzer = "market_analyzer.cli:app"
web-search-mcp = "web_search_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_analyzer", "src/web_search_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly so `ruff check` does not change meaning when ruff's
# defaults change. Extend deliberately, not implicitly.
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = [
    # `timezone.utc` is used consistently and is perfectly valid; switching to
    # the `datetime.UTC` alias would be a large cosmetic diff for no gain.
    "UP017",
    # class X(str, Enum) is used for the model enums on purpose
    "UP042",
    # Allow long lines for prompts and error messages
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally construct provider doubles and unused-shaped fixtures.
"tests/*" = ["B", "SIM"]

